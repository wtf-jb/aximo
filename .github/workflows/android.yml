name: Android CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew test assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Direct download links for the phone (no login, no zip):
      #   main:  releases/download/debug-latest/aximo-debug.apk
      #   PR N:  releases/download/pr-N/aximo-debug.apk
      - name: Publish APK as pre-release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG=debug-latest
            TITLE="Debug build (main)"
          else
            TAG=pr-${{ github.event.pull_request.number }}
            TITLE="Debug build (PR #${{ github.event.pull_request.number }})"
          fi
          cp app/build/outputs/apk/debug/*.apk aximo-debug.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" aximo-debug.apk \
            --prerelease --target "$GITHUB_SHA" --title "$TITLE" \
            --notes "Commit $GITHUB_SHA. Install: download aximo-debug.apk on the phone."

  cleanup-pr-release:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
