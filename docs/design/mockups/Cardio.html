<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cardio erfassen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F3F1; font-family: 'Manrope', sans-serif; color: #17181C; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

  <header style="flex-shrink: 0; padding: 14px 16px 6px; display: flex; align-items: center; gap: 12px">
    <a href="Plaene.html" aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Cardio erfassen</h1>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 12px">

    <div role="radiogroup" aria-label="Aktivität" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <button style="height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
      <span style="flex: 1; text-align: left">Heute, 3. Okt · 08:15</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button aria-label="Dauer" style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; box-shadow: inset 0 0 0 2px #F0643F">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #5D626C">DAUER</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">28:41</div>
        <div style="font-size: 12px; color: #5D626C">mm:ss</div>
      </button>
      <button aria-label="Distanz" style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #5D626C">DISTANZ</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.01em">5,20</div>
        <div style="font-size: 12px; color: #5D626C">km</div>
      </button>
    </div>

    <div style="background: #17181C; color: #FFFFFF; border-radius: 22px; padding: 16px 18px; display: flex; align-items: center; gap: 16px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #B9BCC4">PACE · BERECHNET</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">{{pace}}</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <div style="font-size: 12px; color: #B9BCC4">Ø Tempo</div>
        <div style="font-size: 16px; font-weight: 800">{{speed}}</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 4px 16px; display: flex; flex-direction: column">
      <button style="display: flex; align-items: center; gap: 12px; height: 54px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 700">Ø Puls</span>
        <span style="font-size: 15px; font-weight: 800">152 bpm</span>
      </button>
      <div style="height: 1px; background: #EDEDE9"></div>
      <button style="display: flex; align-items: center; gap: 12px; height: 54px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19l6-10 4 6 3-4 5 8z"></path></svg>
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 700">Höhenmeter</span>
        <span style="font-size: 15px; font-weight: 600; color: #6B707A">optional</span>
      </button>
      <div style="height: 1px; background: #EDEDE9"></div>
      <button style="display: flex; align-items: center; gap: 12px; height: 54px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"></path></svg>
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 700">Notiz</span>
        <span style="font-size: 15px; font-weight: 600; color: #6B707A">optional</span>
      </button>
    </div>

    <button style="height: 48px; border-radius: 16px; box-sizing: border-box; border: 1.5px dashed #C9C9C3; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; color: #4A4E57">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
      Aus Health Connect importieren
    </button>
  </div>

  <div style="flex-shrink: 0; padding: 12px 16px 20px">
    <a href="Heute.html" style="height: 56px; border-radius: 20px; background: #F0643F; color: #17181C; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Speichern</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'Laufen' };
  }
  renderVals() {
    var self = this;
    var types = ['Laufen', 'Rad', 'Rudern', 'Andere'].map(function (l) {
      var on = self.state.type === l;
      return {
        label: l,
        on: on,
        pick: function () { self.setState({ type: l }); },
        style: 'height: 44px; border-radius: 14px; font-size: 14px; font-weight: 800; ' +
          (on ? 'background: #17181C; color: #FFFFFF' : 'background: #FFFFFF; color: #17181C')
      };
    });
    var isRun = this.state.type === 'Laufen';
    return {
      types: types,
      pace: isRun ? '5:31 /km' : '10,9 km/h',
      speed: isRun ? '10,9 km/h' : '5:31 /km'
    };
  }
}
</script>
</body>
</html>
